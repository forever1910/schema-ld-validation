name: validate-ld
on:
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 validate_ld_gha.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ld-validation
          path: ld_validation.json
